<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>
    مسار | لوحة الإدارة
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <link
    rel="stylesheet"
    href="styles.css">

</head>


<body>

<main class="section">

  <div class="section-heading">

    <div>

      <span class="eyebrow">
        مسار
      </span>

      <h1>
        لوحة الإدارة
      </h1>

    </div>


    <a
      class="btn btn-outline"
      href="index.html">

      العودة للمنصة

    </a>

  </div>


  <!-- LOGIN -->

  <section
    id="loginSection"
    class="section alt">

    <div class="section-heading">

      <div>

        <span class="eyebrow">
          الإدارة
        </span>

        <h2>
          تسجيل الدخول
        </h2>

      </div>

      <p>
        الدخول مخصص لفريق إدارة منصة مسار.
      </p>

    </div>


    <form
      id="loginForm"
      style="max-width:500px;margin:auto;">

      <label>
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        required
        placeholder="البريد الإلكتروني"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        كلمة المرور
      </label>

      <input
        id="password"
        type="password"
        required
        placeholder="كلمة المرور"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <button
        class="btn btn-primary"
        type="submit">

        تسجيل الدخول

      </button>


      <p
        id="loginMessage"
        style="margin-top:15px;">
      </p>

    </form>

  </section>


  <!-- ADMIN -->

  <section
    id="adminSection"
    class="section"
    hidden>

    <div class="section-heading">

      <div>

        <span class="eyebrow">
          الإدارة
        </span>

        <h2>
          إدارة منصة مسار
        </h2>

      </div>


      <button
        id="logoutBtn"
        class="btn btn-outline">

        تسجيل الخروج

      </button>

    </div>


    <div class="bacc-banner">

      <div>

        <span class="pill">
          لوحة الإدارة
        </span>

        <h3>
          إضافة مدرس جديد
        </h3>

        <p>
          المدرس الذي تضيفه هنا سيظهر مباشرة في منصة مسار.
        </p>

      </div>

    </div>


    <form
      id="teacherForm"
      style="max-width:650px;margin:35px auto;">

      <label>
        اسم المدرس
      </label>

      <input
        id="teacherName"
        type="text"
        required
        placeholder="مثال: م / محمد صلاح"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        المادة
      </label>

      <input
        id="teacherSubject"
        type="text"
        required
        placeholder="مثال: الرياضيات"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        الصف
      </label>

      <input
        id="teacherGrades"
        type="text"
        required
        placeholder="مثال: الصف الثاني الثانوي"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        المرحلة
      </label>

      <input
        id="teacherStage"
        type="text"
        placeholder="مثال: الثانوية العامة"
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        رابط صورة المدرس
      </label>

      <input
        id="teacherImage"
        type="url"
        placeholder="https://..."
        style="width:100%;padding:12px;margin:8px 0 18px;">


      <label>
        نبذة عن المدرس
      </label>

      <textarea
        id="teacherBio"
        placeholder="نبذة قصيرة عن المدرس"
        style="width:100%;padding:12px;margin:8px 0 18px;min-height:120px;">
      </textarea>


      <label>
        رابط قناة YouTube
      </label>

      <input
        id="teacherYoutube"
        type="url"
        placeholder="https://www.youtube.com/..."
        style="width:100%;padding:12px;margin:8px 0 22px;">


      <button
        class="btn btn-primary"
        type="submit">

        إضافة المدرس

      </button>


      <p
        id="teacherMessage"
        style="margin-top:18px;">
      </p>

    </form>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://meftmrgkqvdvurvrkrkc.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_IFLpHM_wfabV4dYtQXRTiA_CjFm-a5j";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const loginForm =
  document.getElementById(
    "loginForm"
  );


const loginSection =
  document.getElementById(
    "loginSection"
  );


const adminSection =
  document.getElementById(
    "adminSection"
  );


const loginMessage =
  document.getElementById(
    "loginMessage"
  );


const logoutBtn =
  document.getElementById(
    "logoutBtn"
  );


const teacherForm =
  document.getElementById(
    "teacherForm"
  );


const teacherMessage =
  document.getElementById(
    "teacherMessage"
  );


async function checkSession() {

  const {
    data: {
      session
    }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (session) {

    loginSection.hidden =
      true;

    adminSection.hidden =
      false;

  }

}


loginForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    loginMessage.textContent =
      "جاري تسجيل الدخول...";


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .signInWithPassword({
          email,
          password
        });


    if (error) {

      console.error(error);

      loginMessage.textContent =
        "فشل تسجيل الدخول: " +
        error.message;

      return;

    }


    if (data.session) {

      loginSection.hidden =
        true;

      adminSection.hidden =
        false;

      loginMessage.textContent =
        "";

    }

  }
);


logoutBtn.addEventListener(
  "click",
  async () => {

    await supabaseClient
      .auth
      .signOut();


    adminSection.hidden =
      true;

    loginSection.hidden =
      false;

    loginForm.reset();

  }
);


teacherForm.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    teacherMessage.textContent =
      "جاري إضافة المدرس...";


    const {
      data: {
        session
      }
    } =
      await supabaseClient
        .auth
        .getSession();


    if (!session) {

      teacherMessage.textContent =
        "انتهت جلسة الدخول. سجل الدخول مرة أخرى.";

      return;

    }


    const name =
      document
        .getElementById("teacherName")
        .value
        .trim();


    const subject =
      document
        .getElementById("teacherSubject")
        .value
        .trim();


    const gradesText =
      document
        .getElementById("teacherGrades")
        .value
        .trim();


    const stage =
      document
        .getElementById("teacherStage")
        .value
        .trim();


    const image =
      document
        .getElementById("teacherImage")
        .value
        .trim();


    const bio =
      document
        .getElementById("teacherBio")
        .value
        .trim();


    const youtubeChannel =
      document
        .getElementById("teacherYoutube")
        .value
        .trim();


    const grades =
      gradesText
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);


    const {
      data,
      error
    } =
      await supabaseClient
        .from("teachers")
        .insert({

          name,

          subject,

          grades,

          stage,

          image,

          bio,

          youtube_channel:
            youtubeChannel

        })
        .select()
        .single();


    if (error) {

      console.error(
        "INSERT ERROR:",
        error
      );


      teacherMessage.textContent =
        "حدث خطأ: " +
        error.message;

      return;

    }


    console.log(
      "Teacher added:",
      data
    );


    teacherMessage.textContent =
      "تمت إضافة المدرس بنجاح ✅";


    teacherForm.reset();

  }
);


checkSession();

</script>

</body>
</html>
