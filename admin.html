<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مسار | لوحة الإدارة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="section">

    <div class="section-heading">
      <div>
        <span class="eyebrow">مسار</span>
        <h1>لوحة الإدارة</h1>
      </div>

      <a class="btn btn-outline" href="index.html">
        العودة للمنصة
      </a>
    </div>


    <!-- تسجيل الدخول -->

    <section id="loginSection" class="section alt">

      <div class="section-heading">
        <div>
          <span class="eyebrow">الإدارة</span>
          <h2>تسجيل الدخول</h2>
        </div>

        <p>
          الدخول مخصص لفريق إدارة منصة مسار.
        </p>
      </div>

      <form id="loginForm" style="max-width:500px;margin:auto;">

        <label for="email">
          البريد الإلكتروني
        </label>

        <input
          id="email"
          type="email"
          required
          placeholder="البريد الإلكتروني"
          style="width:100%;padding:12px;margin:8px 0 18px;"
        >


        <label for="password">
          كلمة المرور
        </label>

        <input
          id="password"
          type="password"
          required
          placeholder="كلمة المرور"
          style="width:100%;padding:12px;margin:8px 0 18px;"
        >


        <button
          class="btn btn-primary"
          type="submit">
          تسجيل الدخول
        </button>

        <p
          id="loginMessage"
          style="margin-top:15px;">
        </p>

      </form>

    </section>


    <!-- لوحة الإدارة -->

    <section
      id="adminSection"
      class="section"
      hidden>

      <div class="section-heading">

        <div>
          <span class="eyebrow">مسار</span>
          <h2>مرحبًا بك في لوحة الإدارة</h2>
        </div>

        <button
          id="logoutBtn"
          class="btn btn-outline">
          تسجيل الخروج
        </button>

      </div>


      <div class="bacc-banner">

        <div>
          <span class="pill">
            لوحة الإدارة
          </span>

          <h3>
            إدارة المدرسين
          </h3>

          <p>
            من هنا سنضيف المدرسين ومعلوماتهم إلى منصة مسار.
          </p>
        </div>

      </div>

    </section>

  </main>


  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://meftmrgkqvdvurvrkrkc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_IFLpHM_wfabV4dYtQXRTiA_CjFm-a5j";


    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const loginForm =
      document.getElementById("loginForm");

    const loginSection =
      document.getElementById("loginSection");

    const adminSection =
      document.getElementById("adminSection");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutBtn =
      document.getElementById("logoutBtn");


    async function checkSession() {

      const {
        data: {
          session
        }
      } = await supabaseClient.auth.getSession();


      if (session) {

        loginSection.hidden = true;

        adminSection.hidden = false;

      }

    }


    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        loginMessage.textContent =
          "جاري تسجيل الدخول...";


        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          loginMessage.textContent =
            "فشل تسجيل الدخول: " + error.message;

          return;

        }


        if (data.session) {

          loginSection.hidden = true;

          adminSection.hidden = false;

          loginMessage.textContent = "";

        }

      }
    );


    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabaseClient.auth.signOut();

        adminSection.hidden = true;

        loginSection.hidden = false;

        loginForm.reset();

      }
    );


    checkSession();

  </script>

</body>
</html>
